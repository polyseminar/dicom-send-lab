# Polyseminar DICOM send lab: send a CT study to a local PACS the way a scanner does.
# Lab use only. Load public, de-identified test data. Never load real patient data.
# The same commands work on Windows, macOS, and Linux.
name: dicom-send-lab

services:
  pacs:
    image: orthancteam/orthanc:26.9.1
    ports:
      - "127.0.0.1:8042:8042"   # web interface
      - "127.0.0.1:4242:4242"   # DICOM: the scanner sends here
    environment:
      ORTHANC__NAME: "DICOM send lab"
      ORTHANC__DICOM_AET: "ORTHANC"       # the PACS's AE title
      ORTHANC_PASSWORD: "orthanc"         # user: orthanc, password: orthanc
      OHIF_PLUGIN_ENABLED: "true"
      DICOM_WEB_PLUGIN_ENABLED: "true"
    volumes:
      - pacs-data:/var/lib/orthanc/db
    healthcheck:
      test: ["CMD", "/probes/test-aliveness.py"]
      interval: 5s
      retries: 12

  # One-off helper: downloads the public test study into the "study" volume
  # Run with: docker compose run --rm download
  download:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /study
    volumes:
      - study:/study
    # Install the IDC download tool, fetch one patient, list the folders
    command:
      - sh
      - -c
      - >-
        pip install --quiet --disable-pip-version-check --root-user-action=ignore idc-index==0.12.5
        && idc download PAN_03
        && find ctpred_sunitinib_pannet -maxdepth 3 -type d

  # One-off helper: DCMTK, the DICOM command-line tools, playing the scanner
  # Run with: docker compose run --rm dcmtk echoscu -v -aet CT_LAB -aec ORTHANC pacs 4242
  dcmtk:
    build:
      dockerfile_inline: |
        FROM debian:trixie-20261005-slim
        RUN apt-get update && apt-get install -y --no-install-recommends dcmtk && rm -rf /var/lib/apt/lists/*
    profiles: ["tools"]
    depends_on:
      pacs:
        condition: service_healthy
    working_dir: /study/ctpred_sunitinib_pannet
    volumes:
      - study:/study:ro

volumes:
  pacs-data:   # the PACS database and stored images
  study:       # the downloaded test study
